[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memoir-backend"
version = "0.1.0"
description = "Django backend for Memoir"
requires-python = ">=3.11"
dependencies = [
  "Django>=5.1,<6",
  "django-cors-headers>=4.6",
  "djangorestframework>=3.15",
  "psycopg[binary]>=3.2",
  "python-dotenv>=1.0",
  "uvicorn[standard]>=0.32",
]

[tool.setuptools]
packages = []
